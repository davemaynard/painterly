<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>painterly</title>
  <!--
    One loaded brush stroke: thick where it lands, tapering as it lifts. It is
    the mark the library exists to make, and one bold shape is all that survives
    at the size a browser tab draws it. Ink on paper, on its own tile, so it
    reads the same against a light tab strip and a dark one.
  -->
