name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # docs/ is the published demo and is committed; it must match the source.
      - run: git diff --exit-code -- docs
      # The command line paints with the library just built.
      - run: npm ci --prefix cli
      - run: npm run check --prefix cli
      - run: npm test --prefix cli
